<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./data/sample-plan.json"></script>
    <script type="module" src="./js/api.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script> 

    <title>TaskBoard</title>
</head>
<body>
    <main>
         <section class="m-18 pl-24 pr-24">
            <div>
                <p class="ml-4 pl-4 mt-8 text-xl font-bold" id="projet"></p>
                <p class="ml-4 p-4 text-xl" id="hours"></p>

            </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 m-6 rounded-2xl">
                <article class="rounded-xl shadow-sm overflow-hidden">
                    <div class="flex justify-between items-center bg-[#187C81] p-3">
                        <h3 class="font-bold text-gray-800">To Do</h3>
                        <span class="text-sm text-gray-600">6</span>
                    </div>
                    <div id="to-do">

                    </div>
                </article>

                <article class=" rounded-xl shadow-sm overflow-hidden">
                    <div class="flex justify-between items-center bg-[#187C81] p-3">
                        <h3 class="font-bold text-gray-800">In progress</progress></h3>
                        <span class="text-sm text-gray-600">6</span>
                    </div class="in-progress">
                    <div>

                    </div>
                </article>

                <article class="rounded-xl shadow-sm overflow-hidden">
                    <div class="flex justify-between items-center bg-[#187C81] p-3">
                        <h3 class="font-bold text-gray-800">Done</h3>
                        <span class="text-sm text-gray-600">6</span>
                    </div>
                    <div class="done">

                    </div>
                </article>
                </div>
        </section> 

    </main>
</body>
</html>
